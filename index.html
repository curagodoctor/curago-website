        height: auto;

      /* Prevent horizontal scroll on mobile */

        overflow-x: hidden;
        width: 100%;

      nav a, nav button {
        color: #374151; /* text-gray-700 */

        color: #096b17;

      @media (min-width: 768px) {
        .hidden.md\:flex {
          display: flex !important;
        }
        .md\:hidden {
          display: none !important;
        }
      }

      .flex {

      }

        padding-bottom: 3rem;

      }
      .px-4 {
        padding-left: 1rem;
        padding-right: 1rem;

      }

      /* Width/Max-width utilities */
      .max-w-4xl {
        max-width: 56rem;
      }
      .max-w-7xl {
        max-width: 80rem;
      }
      .mx-auto {
        margin-left: auto;
        margin-right: auto;
      }

      /* Min-height utilities */
      .min-h-screen {
        min-height: 100vh;
      }

      /* Text alignment */
      .text-center {
        text-align: center;
      }

      /* Grid utilities */
      .grid {
        display: grid;
      }
      @media (min-width: 768px) {
        .md\:grid-cols-2 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      /* Button/Width utilities - prevents stretched buttons */
      .w-full {
        width: 100%;
      }
      @media (min-width: 640px) {
        .sm\:w-auto {
          width: auto !important;

      }

      /* Flex direction utilities */
      .flex-col {
        flex-direction: column;
      }
      @media (min-width: 640px) {
        .sm\:flex-row {

        }
      }

      .rounded-2xl {
        border-radius: 1rem;
      }
